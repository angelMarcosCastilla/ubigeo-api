name = "ubigeo-api"
main = "src/index.ts"
compatibility_date = "2024-09-10"

# Serves the built frontend at "/"; /api/* requests fall through to the Worker.
[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

